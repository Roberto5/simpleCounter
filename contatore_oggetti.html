<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatore Oggetti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Animazione per l'aumento del conteggio */
        @keyframes pulse-count {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .pulse {
            animation: pulse-count 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans antialiased text-slate-800">

    <div class="bg-white rounded-3xl shadow-xl w-full max-w-md p-8 flex flex-col items-center border border-slate-200/60">
        <!-- Titolo -->
        <h1 class="text-2xl font-bold text-slate-700 mb-2 flex items-center gap-2">
            <i class="fa-solid fa-boxes-stacked text-indigo-600"></i>
            Contatore Oggetti
        </h1>
        <p class="text-slate-400 text-sm mb-8 text-center">Tieni il conto in modo semplice e veloce</p>

        <!-- Display Conteggio -->
        <div id="counter-container" class="w-full bg-slate-50 rounded-2xl p-8 mb-8 text-center border border-slate-100 shadow-inner cursor-pointer hover:bg-slate-100/60 transition-colors group relative" title="Doppio click per modificare">
            <span id="counter" class="text-7xl font-extrabold text-indigo-600 block transition-transform duration-100 select-none">
                0
            </span>
            <div class="mt-2 text-xs font-medium text-slate-400 group-hover:text-indigo-500 transition-colors flex items-center justify-center gap-1 select-none">
                <i class="fa-solid fa-pen-to-square"></i>
                <span>Doppio click/tap per impostare</span>
            </div>
        </div>

        <!-- Pulsanti di Azione -->
        <div class="w-full flex flex-col gap-4">
            <!-- Pulsante +1 -->
            <button id="btn-increment" class="w-full py-5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold text-xl rounded-2xl shadow-lg shadow-indigo-200 active:shadow-none transition-all duration-150 flex items-center justify-center gap-3 touch-manipulation">
                <i class="fa-solid fa-plus text-2xl"></i>
                <span>Aggiungi (+1)</span>
            </button>

            <!-- Slider di Azzeramento a 2 fasi (Destra -> Sinistra) -->
            <div class="w-full mt-2">
                <div id="slider-track" class="relative w-full h-14 bg-slate-100 rounded-2xl border border-slate-200/80 p-1 overflow-hidden select-none touch-none flex items-center">
                    <!-- Sfondo colorato durante il trascinamento -->
                    <div id="slider-fill" class="absolute top-1 bottom-1 left-1 rounded-xl bg-indigo-100 transition-colors duration-200 pointer-events-none" style="width: 0px;"></div>
                    
                    <!-- Etichetta con istruzione -->
                    <div id="slider-label" class="absolute inset-0 flex items-center justify-center text-xs sm:text-sm font-medium text-slate-400 pointer-events-none z-0 px-12 text-center transition-colors duration-200">
                        <span>Trascina a destra <i class="fa-solid fa-arrow-right ml-1"></i></span>
                    </div>

                    <!-- Maniglia Trascinabile -->
                    <div id="slider-handle" class="relative z-10 w-12 h-12 bg-white rounded-xl shadow-md border border-slate-200/80 flex items-center justify-center cursor-grab active:cursor-grabbing text-indigo-600 transition-shadow">
                        <i id="slider-icon" class="fa-solid fa-angles-right text-base transition-transform duration-200"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal per inserimento valore personalizzato -->
    <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 opacity-0 pointer-events-none transition-opacity duration-200">
        <div id="modal-box" class="bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl border border-slate-100 transform scale-95 transition-all duration-200">
            <h2 class="text-lg font-bold text-slate-700 mb-1 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-indigo-600"></i>
                Imposta Conteggio
            </h2>
            <p class="text-xs text-slate-400 mb-4">Inserisci manualmente un numero:</p>
            
            <input type="number" id="custom-input" min="0" placeholder="0" class="w-full px-4 py-3 text-center text-3xl font-extrabold text-indigo-600 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white mb-5">
            
            <div class="flex gap-2">
                <button id="btn-cancel" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold text-sm rounded-xl transition-colors">
                    Annulla
                </button>
                <button id="btn-save" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold text-sm rounded-xl shadow-md transition-colors">
                    Salva
                </button>
            </div>
        </div>
    </div>

    <script>
        // Stato del contatore
        let count = 0;

        // Riferimenti agli elementi DOM
        const counterEl = document.getElementById('counter');
        const counterContainer = document.getElementById('counter-container');
        const btnIncrement = document.getElementById('btn-increment');

        // Elementi Modal
        const modalBackdrop = document.getElementById('modal-backdrop');
        const modalBox = document.getElementById('modal-box');
        const customInput = document.getElementById('custom-input');
        const btnCancel = document.getElementById('btn-cancel');
        const btnSave = document.getElementById('btn-save');

        // Elementi dello slider di azzeramento
        const sliderTrack = document.getElementById('slider-track');
        const sliderHandle = document.getElementById('slider-handle');
        const sliderFill = document.getElementById('slider-fill');
        const sliderLabel = document.getElementById('slider-label');
        const sliderIcon = document.getElementById('slider-icon');

        // Stato dello slider
        let isDragging = false;
        let startX = 0;
        let currentX = 0;
        let phase = 1; // 1 = in corsa verso destra, 2 = raggiunta la destra, in ritorno verso sinistra

        function getTrackLimits() {
            const trackWidth = sliderTrack.clientWidth;
            const handleWidth = sliderHandle.clientWidth;
            const padding = 8; // p-1 = 4px per lato
            return trackWidth - handleWidth - padding;
        }

        // Funzione per aggiornare il display con animazione
        function updateDisplay() {
            counterEl.textContent = count;
            
            // Aggiungi e rimuovi la classe di animazione
            counterEl.classList.remove('pulse');
            // Trick per riattivare la CSS animation
            void counterEl.offsetWidth; 
            counterEl.classList.add('pulse');
        }

        // Event listener per il pulsante +1
        btnIncrement.addEventListener('click', () => {
            count++;
            updateDisplay();
        });

        // Gestione Modal Personalizzato
        function openModal() {
            customInput.value = count;
            modalBackdrop.classList.remove('opacity-0', 'pointer-events-none');
            modalBox.classList.remove('scale-95');
            modalBox.classList.add('scale-100');
            
            setTimeout(() => {
                customInput.focus();
                customInput.select();
            }, 50);
        }

        function closeModal() {
            modalBackdrop.classList.add('opacity-0', 'pointer-events-none');
            modalBox.classList.remove('scale-100');
            modalBox.classList.add('scale-95');
        }

        function saveCustomValue() {
            const val = parseInt(customInput.value, 10);
            if (!isNaN(val) && val >= 0) {
                count = val;
                updateDisplay();
            }
            closeModal();
        }

        // Eventi doppio click (PC)
        counterContainer.addEventListener('dblclick', openModal);

        // Eventi doppio tap avanzato per Mobile/Touch
        let lastTapTime = 0;
        counterContainer.addEventListener('touchend', (e) => {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTapTime;
            if (tapLength < 300 && tapLength > 0) {
                e.preventDefault();
                openModal();
            }
            lastTapTime = currentTime;
        });

        // Eventi Modal
        btnCancel.addEventListener('click', closeModal);
        btnSave.addEventListener('click', saveCustomValue);
        
        // Chiudi cliccando lo sfondo opaco
        modalBackdrop.addEventListener('click', (e) => {
            if (e.target === modalBackdrop) closeModal();
        });

        // Invio e ESC da tastiera
        customInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') saveCustomValue();
            if (e.key === 'Escape') closeModal();
        });

        // Gestione del Trascinamento (Mouse & Touch)
        function startDrag(clientX) {
            isDragging = true;
            startX = clientX - currentX;
            sliderHandle.classList.remove('transition-all');
            sliderFill.classList.remove('transition-all');
        }

        function onDrag(clientX) {
            if (!isDragging) return;

            const maxOffset = getTrackLimits();
            let dx = clientX - startX;

            // Clampa il valore tra 0 e maxOffset
            dx = Math.max(0, Math.min(dx, maxOffset));
            currentX = dx;

            // Aggiorna posizione maniglia e ampiezza fill
            sliderHandle.style.transform = `translateX(${currentX}px)`;
            sliderFill.style.width = `${currentX + 48}px`;

            if (phase === 1) {
                // Fase 1: trascinamento verso destra
                if (currentX >= maxOffset - 4) {
                    phase = 2; // Raggiunta l'estremità destra!
                    sliderLabel.innerHTML = '<span><i class="fa-solid fa-arrow-left mr-1"></i> Ora torna a sinistra</span>';
                    sliderLabel.className = "absolute inset-0 flex items-center justify-center text-xs sm:text-sm font-bold text-amber-600 pointer-events-none z-0 px-12 text-center";
                    sliderFill.className = "absolute top-1 bottom-1 left-1 rounded-xl bg-amber-100 pointer-events-none";
                    sliderIcon.className = "fa-solid fa-angles-left text-base text-amber-600";
                }
            } else if (phase === 2) {
                // Fase 2: ritorno verso sinistra
                if (currentX <= 4) {
                    // Completato il giro avanti e indietro! AZZERAMENTO
                    executeReset();
                }
            }
        }

        function stopDrag() {
            if (!isDragging) return;
            isDragging = false;

            // Se non ha completato le due fasi, ripristina la posizione iniziale con animazione
            sliderHandle.classList.add('transition-all', 'duration-300');
            sliderFill.classList.add('transition-all', 'duration-300');
            resetSliderUI();
        }

        function executeReset() {
            count = 0;
            updateDisplay();

            // Feedback visivo azzeramento avvenuto
            sliderLabel.innerHTML = '<span class="text-rose-600 font-bold"><i class="fa-solid fa-check mr-1"></i> Conteggio Azzerato!</span>';
            sliderFill.className = "absolute top-1 bottom-1 left-1 rounded-xl bg-rose-100 pointer-events-none";
            
            setTimeout(() => {
                resetSliderUI();
            }, 800);
        }

        function resetSliderUI() {
            currentX = 0;
            phase = 1;
            sliderHandle.style.transform = 'translateX(0px)';
            sliderFill.style.width = '0px';
            sliderLabel.innerHTML = '<span>Trascina a destra <i class="fa-solid fa-arrow-right ml-1"></i></span>';
            sliderLabel.className = "absolute inset-0 flex items-center justify-center text-xs sm:text-sm font-medium text-slate-400 pointer-events-none z-0 px-12 text-center";
            sliderFill.className = "absolute top-1 bottom-1 left-1 rounded-xl bg-indigo-100 pointer-events-none";
            sliderIcon.className = "fa-solid fa-angles-right text-base text-indigo-600";
        }

        // Event listeners per Mouse
        sliderHandle.addEventListener('mousedown', (e) => startDrag(e.clientX));
        window.addEventListener('mousemove', (e) => onDrag(e.clientX));
        window.addEventListener('mouseup', () => stopDrag());

        // Event listeners per Touch (Mobile)
        sliderHandle.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) startDrag(e.touches[0].clientX);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) onDrag(e.touches[0].clientX);
        }, { passive: true });

        window.addEventListener('touchend', () => stopDrag());
    </script>
</body>
</html>
